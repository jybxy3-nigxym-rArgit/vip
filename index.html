<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مزاد ابو سارة</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
      @media (prefers-color-scheme: dark) {
        body { background-color: #121212; }
        .auction-card { background: #1e1e1e; border-color: #c5a059; color: #ffffff; }
        .price-box { background: #2d2d2d; border-color: #444; color: #ffffff; }
        .input-field { background: #2d2d2d; border-color: #444; color: #ffffff; }
        .bid-item { border-bottom-color: #333; color: #eee; }
        .history-header { background: #c5a059; color: #1d2d44; }
        .announcement-bar { background: #2d2613; color: #c5a059; }
        .saved-info { background: #2d2d2d; color: #c5a059; border-color: #444; }
      }
      .centered-top-container, .centered-top, .return_link, .back-button, .blog-name, #header, nav[role="navigation"] { display: none !important; }
      * { box-sizing:border-box; font-family:'Tajawal',sans-serif; }
      body { margin:0; padding:15px 0; background-color:#f4f6f8; display:flex; flex-direction:column; align-items:center; }
      .auction-card { width:100%; max-width:420px; background:#fff; border:3px solid #1d2d44; border-radius:30px; overflow:hidden; box-shadow:0 15px 35px rgba(0,0,0,0.1); }
      .top-banner { background:#1d2d44; color:#fff; padding:18px; text-align:center; font-size:19px; font-weight:700; border-bottom:2px solid #c5a059; }
      .announcement-bar { background: #fff9e6; color: #1d2d44; padding: 8px 0; overflow: hidden; white-space: nowrap; border-bottom: 1px solid #c5a059; display:none; }
      .announcement-text { display: inline-block; padding-right: 100%; animation: marquee 15s linear infinite; font-weight: bold; font-size: 14px; }
      @keyframes marquee { 0% { transform: translate(-100%, 0); } 100% { transform: translate(100%, 0); } }
      .timer-bar { background:#fff9e6; padding:10px; border-bottom:1px solid #ffeeba; text-align:center; display:none; }
      #timerText { font-size:18px; font-weight:700; color:#c0392b; }
      .number-container { padding:40px 10px; background:#1d2d44; margin:20px auto; border-radius:20px; border:2px solid #c5a059; display:flex; justify-content:center; width:calc(100% - 40px); }
      .number-display { font-size:38px; font-weight:800; letter-spacing:5px; color:#fff; }
      .price-box { background:#fdfdfd; margin:0 20px 15px; padding:15px; border-radius:20px; text-align:center; border:1px solid #eee; }
      .price-box strong { font-size:28px; color:#27ae60; display:block; }
      .bid-area { padding:0 20px 20px; }
      .input-field { width: 100%; padding: 20px; margin-bottom: 15px; border: 2px solid #eee; border-radius: 15px; font-size: 20px; font-weight: bold; text-align: center; outline: none; transition: border-color 0.3s; }
      .input-field:focus { border-color: #c5a059; background-color: #fffdf9; }
      .input-field:read-only { background-color: #f0f0f0; color: #888; cursor: not-allowed; border-color: #ddd; }
      .fixed-bids-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:15px; }
      .btn-fixed { padding:15px 5px; background:#1d2d44; color:#fff; border:none; border-radius:12px; font-size:16px; font-weight:700; cursor:pointer; }
      .btn-custom { width:100%; padding:15px; background:#c5a059; color:#fff; border:none; border-radius:12px; font-size:17px; font-weight:700; cursor:pointer; }
      .disabled-btn { opacity:0.4; cursor:not-allowed !important; }
      .history-header { background:#1d2d44; color:white; padding:10px; text-align:center; font-size:14px; font-weight:700; }
      .bid-item { display:flex; justify-content:space-between; padding:12px 20px; border-bottom:1px solid #eee; font-size:14px; }
      #loader { position:fixed; top:0; left:0; width:100%; height:100%; background:#1d2d44; display:flex; flex-direction:column; justify-content:center; align-items:center; z-index:9999; color:white; }
      .spinner { width:50px; height:50px; border:5px solid rgba(255,255,255,0.2); border-top:5px solid #c5a059; border-radius:50%; animation:spin 0.8s linear infinite; margin-bottom:15px; }
      @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      .min-increment-hint { text-align: center; font-size: 13px; color: #c5a059; margin: -5px 0 15px; font-weight: 500; }
      .saved-info { text-align: center; font-size: 13px; margin-top: -10px; margin-bottom: 15px; padding: 5px; background: #f9f9f9; border-radius: 8px; border: 1px solid #eee; color: #27ae60; font-weight: 500; display: none; }
      /* تنسيق الرابط بنفس لون النص مع خط تحتي */
      .terms-link { color: inherit; text-decoration: underline; cursor: pointer; }
    </style>
</head>
<body>
<div id="loader"><div class="spinner"></div><b>جاري تحميل بيانات المزاد...</b></div>

<div class="auction-card">
    <div class="top-banner">مزاد ابو سارة للارقام المميزة</div>
    <div id="annBar" class="announcement-bar"><div id="annText" class="announcement-text"></div></div>
    <div id="timerBar" class="timer-bar"><span>⏳ ينتهي خلال: </span><span id="timerText">--:--:--</span></div>  
    <div class="number-container"><div class="number-display" id="numDisplay">--------</div></div>
    <div class="price-box"><small id="priceLabel">أعلى سومة حالياً</small><strong id="priceDisplay">0 ريال</strong></div>
    <div class="bid-area" id="bidArea">
        <input type="tel" id="phoneInp" class="input-field" placeholder="جوالك (05xxxxxxxx)" maxlength="10">
        <div id="savedPhoneInfo" class="saved-info"></div>
        <div style="text-align:center;margin-bottom:15px;font-size:14px;">
            <input type="checkbox" id="termsCheck" onchange="handleTermsChange(this.checked)">
            <label for="termsCheck" style="cursor:pointer;"> للمزايدة يجب الموافقة على </label>
            <a href="#" id="termsLink" class="terms-link" target="_blank">الشروط والأحكام</a>
        </div>
        <div id="minIncrementHint" class="min-increment-hint"></div>
        <div class="fixed-bids-grid">
            <button onclick="sendBid('fixed',50)" class="btn-fixed disabled-btn">+50</button>
            <button onclick="sendBid('fixed',100)" class="btn-fixed disabled-btn">+100</button>
            <button onclick="sendBid('fixed',250)" class="btn-fixed disabled-btn">+250</button>
            <button onclick="sendBid('fixed',400)" class="btn-fixed disabled-btn">+400</button>
            <button onclick="sendBid('fixed',650)" class="btn-fixed disabled-btn">+650</button>
            <button onclick="sendBid('fixed',1000)" class="btn-fixed disabled-btn">+1000</button>
        </div>
        <input type="number" id="customAmount" class="input-field" placeholder="زيادة مخصصة" inputmode="decimal">
        <button onclick="sendBid('custom')" class="btn-custom disabled-btn" id="btnCustom">إرسال المزايدة</button>
    </div>
    <div class="history-header">آخر 5 مزايدات على هذا الرقم</div>
    <div id="listDisplay"></div>
</div>

<script>
    // ========== إعدادات التطبيق ==========
    const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxvJPyvCXy_6Z5kkNa2xQ-nnm9RghaPK1awzjzP_yQFamxhF1gsnyAPbRcfPTld46Xzzg/exec'; // ضع رابطك الجديد هنا
    const TERMS_URL = 'https://souq3rb.blogspot.com/2025/08/root-bg0f172a-card0b1224-inke5e7eb.html'; // ضع رابط صفحة الشروط هنا
    
    // ========== إعدادات الجهاز ==========
    let deviceId = localStorage.getItem('deviceId');
    if (!deviceId) {
        deviceId = 'device_' + Math.random().toString(36).substr(2, 9);
        localStorage.setItem('deviceId', deviceId);
    }
    let minIncrement = 1;
    let countdownInterval = null;
    let endTime = null;
    let waitingInterval = null;
    let userIP = '';
    let termsAgreementSent = localStorage.getItem('termsAgreementSent_' + deviceId) === 'true';

    // تعيين رابط الشروط
    document.getElementById('termsLink').href = TERMS_URL;

    // جلب IP الجهاز
    async function fetchIP() {
        try {
            const res = await fetch('https://api.ipify.org?format=json');
            const data = await res.json();
            userIP = data.ip;
        } catch(e) {
            userIP = 'غير معروف';
        }
    }

    function toggleButtons(isChecked) {
        document.querySelectorAll('.btn-fixed,.btn-custom').forEach(btn => btn.classList.toggle('disabled-btn', !isChecked));
    }

    // دالة معالجة تغيير حالة الموافقة
    async function handleTermsChange(isChecked) {
        toggleButtons(isChecked);
        if (isChecked && !termsAgreementSent) {
            const phoneInput = document.getElementById('phoneInp');
            const phone = phoneInput.value.trim();
            if (phone && /^05\d{8}$/.test(phone)) {
                try {
                    const response = await fetch(WEB_APP_URL, {
                        method: 'POST',
                        body: JSON.stringify({
                            action: 'record_terms_agreement',
                            deviceId: deviceId,
                            phone: phone,
                            ip: userIP
                        })
                    });
                    const result = await response.json();
                    if (result.success) {
                        termsAgreementSent = true;
                        localStorage.setItem('termsAgreementSent_' + deviceId, 'true');
                    }
                } catch(e) {
                    console.log("Error sending terms agreement:", e);
                }
            }
        }
    }

    async function identifyUser() {
        try {
            const res = await fetch(WEB_APP_URL + '?action=get_user_by_device&deviceId=' + encodeURIComponent(deviceId));
            const data = await res.json();
            const phoneInput = document.getElementById('phoneInp');
            const savedInfoDiv = document.getElementById('savedPhoneInfo');
            if (data.phone && data.phone.trim() !== "") {
                phoneInput.value = data.phone;
                phoneInput.readOnly = true;
                phoneInput.title = "رقمك مسجل مسبقاً ولا يمكن تغييره";
                savedInfoDiv.innerHTML = "✅ تم تسجيلك آخر مرة برقم جوال: " + data.phone;
                savedInfoDiv.style.display = "block";
            } else {
                phoneInput.readOnly = false;
                phoneInput.value = "";
                savedInfoDiv.style.display = "none";
            }
        } catch(e) { 
            console.log("Identity Error", e);
            const phoneInput = document.getElementById('phoneInp');
            phoneInput.readOnly = false;
            document.getElementById('savedPhoneInfo').style.display = "none";
        }
    }

    function updateCountdown() {
        if (!endTime || isNaN(endTime)) {
            const timerBar = document.getElementById('timerBar');
            if(timerBar) timerBar.style.display = 'none';
            return;
        }
        const now = new Date().getTime();
        const distance = endTime - now;
        if (distance <= 0) {
            const timerSpan = document.getElementById('timerText');
            if(timerSpan) timerSpan.innerText = 'انتهى المزاد';
            if (countdownInterval) clearInterval(countdownInterval);
            setTimeout(() => location.reload(), 2000);
            return;
        }
        const hours = Math.floor(distance / (1000 * 60 * 60));
        const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((distance % (1000 * 60)) / 1000);
        const timerSpan = document.getElementById('timerText');
        if(timerSpan) {
            timerSpan.innerText = 
                (hours < 10 ? '0' + hours : hours) + ':' +
                (minutes < 10 ? '0' + minutes : minutes) + ':' +
                (seconds < 10 ? '0' + seconds : seconds);
        }
    }

    function updateWaitingCountdown(waitEndTime) {
        const now = new Date().getTime();
        const distance = waitEndTime - now;
        if (distance <= 0) {
            if (waitingInterval) clearInterval(waitingInterval);
            location.reload();
            return;
        }
        const minutes = Math.floor(distance / (1000 * 60));
        const seconds = Math.floor((distance % (1000 * 60)) / 1000);
        document.getElementById('timerText').innerText = `${minutes}:${seconds < 10 ? '0' + seconds : seconds}`;
        document.getElementById('timerBar').style.display = 'block';
        document.getElementById('timerBar').querySelector('span:first-child').innerText = '⏳ المزاد القادم بعد: ';
    }

    async function load() {
        try {
            await identifyUser();
            await fetchIP();

            const res = await fetch(WEB_APP_URL + '?action=get_all_bids&deviceId=' + encodeURIComponent(deviceId) + '&t=' + Date.now());
            const data = await res.json();

            if (data.success === false && data.message === "أنت محظور من دخول المزاد") {
                document.body.innerHTML = `<div style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; background:#1d2d44; color:white; text-align:center; padding:20px;"><h1>🚫 تم حظر الوصول</h1><p>جهازك محظور</p></div>`;
                return;
            }

            if (data.waiting === true) {
                const waitingNumber = data.number;
                const waitEndTime = new Date(data.waitEndTime).getTime();
                document.getElementById('numDisplay').innerText = waitingNumber;
                document.getElementById('priceDisplay').innerText = "سيبدأ قريباً";
                document.getElementById('bidArea').style.display = 'none';
                document.getElementById('listDisplay').innerHTML = '<div class="bid-item" style="justify-content:center;">المزاد سيبدأ خلال لحظات</div>';
                document.getElementById('loader').style.display = 'none';
                if (waitingInterval) clearInterval(waitingInterval);
                waitingInterval = setInterval(() => updateWaitingCountdown(waitEndTime), 1000);
                updateWaitingCountdown(waitEndTime);
                return;
            }

            if (data.status === 'Closed') {
                document.body.innerHTML = `<div style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; background:#1d2d44; color:white; text-align:center; padding:20px;"><h1>🔒 انتهى المزاد</h1><p>شكراً لمشاركتكم</p></div>`;
                return;
            }

            document.getElementById('bidArea').style.display = 'block';
            if (waitingInterval) clearInterval(waitingInterval);

            if (data.endTime) {
                let parsedEnd = new Date(data.endTime).getTime();
                if (!isNaN(parsedEnd)) {
                    endTime = parsedEnd;
                    const timerBar = document.getElementById('timerBar');
                    if (timerBar) {
                        timerBar.style.display = 'block';
                        timerBar.querySelector('span:first-child').innerText = '⏳ ينتهي خلال: ';
                        if (countdownInterval) clearInterval(countdownInterval);
                        countdownInterval = setInterval(updateCountdown, 1000);
                        updateCountdown();
                    }
                } else {
                    document.getElementById('timerBar').style.display = 'none';
                }
            } else {
                document.getElementById('timerBar').style.display = 'none';
            }

            minIncrement = data.minIncrement || 1;
            const hintSpan = document.getElementById('minIncrementHint');
            if(hintSpan) hintSpan.innerText = `الحد الأدنى للزيادة: ${minIncrement} ريال`;
            
            if(data.announcement && data.announcement.trim() !== "") {
                const annBar = document.getElementById('annBar');
                const annText = document.getElementById('annText');
                if(annBar && annText) {
                    annBar.style.display = 'block';
                    annText.innerText = data.announcement;
                }
            } else {
                const annBar = document.getElementById('annBar');
                if(annBar) annBar.style.display = 'none';
            }

            const numDisplay = document.getElementById('numDisplay');
            if(numDisplay) numDisplay.innerText = data.number || '--------';
            
            const priceDisplay = document.getElementById('priceDisplay');
            if(priceDisplay) priceDisplay.innerText = (data.highestBidAmount || 0) + " ريال";
            
            const listContainer = document.getElementById('listDisplay');
            if(listContainer) {
                listContainer.innerHTML = data.bids && data.bids.length ? data.bids.slice(0,5).map(b => 
                    `<div class="bid-item"><span>******${b.phone.toString().slice(-4)}</span><span>${b.amount} ريال</span></div>`
                ).join('') : '<div class="bid-item" style="justify-content:center;">لا توجد مزايدات بعد</div>';
            }
            
            const loader = document.getElementById('loader');
            if(loader) loader.style.display = 'none';
        } catch(e) { 
            console.error("Load error:", e);
            const loader = document.getElementById('loader');
            if(loader) loader.style.display = 'none';
            const listContainer = document.getElementById('listDisplay');
            if(listContainer) listContainer.innerHTML = '<div class="bid-item" style="justify-content:center;color:red;">خطأ في الاتصال بالخادم</div>';
        }
    }

    async function sendBid(type, amt=0) {
        const phoneInput = document.getElementById('phoneInp');
        let phone = phoneInput.value.trim();
        
        if (!/^05\d{8}$/.test(phone)) {
            alert("رقم الجوال غير صحيح، يجب أن يبدأ بـ 05 ويتكون من 10 أرقام");
            return;
        }
        
        let addedAmt = (type === 'fixed') ? amt : parseFloat(document.getElementById('customAmount').value);
        
        if(isNaN(addedAmt) || addedAmt <= 0) {
            alert("الرجاء إدخال مبلغ صحيح أكبر من صفر");
            return;
        }
        if (addedAmt < minIncrement) {
            alert(`الزيادة قليلة جداً، الحد الأدنى للزيادة هو ${minIncrement} ريال`);
            return;
        }
        if(!confirm(`تأكيد المزايدة بمبلغ ${addedAmt} ريال على الرقم ${document.getElementById('numDisplay').innerText}؟`)) return;
        
        try {
            const response = await fetch(WEB_APP_URL, { 
                method: 'POST', 
                body: JSON.stringify({ 
                    action: 'place_bid', 
                    phone: phone, 
                    amount: addedAmt, 
                    deviceId: deviceId,
                    ip: userIP
                })
            });
            const result = await response.json();
            if (result.success) {
                alert("✅ تمت المزايدة بنجاح!");
                location.reload();
            } else {
                alert(result.message || "حدث خطأ أثناء المزايدة");
            }
        } catch(e) {
            alert("فشل الاتصال بالخادم، تأكد من اتصالك بالإنترنت");
        }
    }

    // تهيئة الصفحة
    load();
    setInterval(load, 15000);
</script>
</body>
</html>
